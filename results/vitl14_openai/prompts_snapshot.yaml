# ---- E2：程度表现（针对 ひびわれ；每组恰好 3 级：轻 → 中 → 重） ------------
degree:
  template: "a photo of a concrete surface with {}."
  sets:
    adjective:
      levels:
        - ["a slight crack", "a minor crack", "a small crack"]
        - ["a moderate crack", "a medium crack", "a noticeable crack"]
        - ["a severe crack", "a major crack", "a serious crack"]
    width:
      levels:
        - ["a hairline crack", "a very fine crack", "a very thin crack"]
        - ["a crack of medium width", "a moderately wide crack", "a clearly open crack"]
        - ["a wide crack", "a very wide crack", "a wide open crack"]
    extent:
      levels:
        - ["a single short crack", "one isolated crack", "a short crack line"]
        - ["several cracks", "a few intersecting cracks", "multiple crack lines"]
        - ["a dense network of cracks", "map cracking over the whole surface", "cracks in a grid pattern everywhere"]
    manual:
      # 付録-3 ⑥ひびわれ（PDF p.292-293）：损伤程度由"最大ひびわれ幅(大/中/小)"与"最小ひびわれ間隔(大/小)"组合决定。
      source: "付録-3 ⑥ひびわれ pp.22-23（PDF p.292-293）。合并方式：b（幅小・間隔大）→0；c/d（幅小・間隔小，幅中・間隔大/小，幅大・間隔大）→1；e（幅大・間隔小）→2；a（損傷なし）不使用。mm 与 m 的绝对尺度改写为相对的视觉描述。"
      levels:
        - ["a few hairline cracks spaced far apart", "a single very thin crack", "sparse fine cracks with wide gaps between them"]
        - ["thin cracks spaced close together", "a few clearly visible cracks of medium width", "several moderately open cracks"]
        - ["many wide open cracks close together", "a dense pattern of wide cracks", "wide gaping cracks spaced tightly across the surface"]

