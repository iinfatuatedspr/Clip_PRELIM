    codebrim_tag: Crack
    jp_term: "ひびわれ"
    manual_ref: "付録-3 損傷程度の評価要領 ⑥ひびわれ pp.22-32（PDF p.292-302）；照片：参考資料2 ひびわれ（PDF p.383-388）"
    label: "a crack"
    term_literal: "cracking"
    attr:
      - text: "a thin dark line running straight across the surface"
        source: "付録-3 p.22 一般的性状（PDF p.292）；p.24 パターン①鉛直ひびわれ（PDF p.294）"
      - text: "a thin jagged line that wanders irregularly"
        source: "参考資料2 ひびわれ 6/6 写真（PDF p.388）"
      - text: "a fine black line contrasting with the pale grey surface"
        source: "付録-3 p.22 一般的性状（PDF p.292）；参考資料2 写真（PDF p.383）"
      - text: "a dark hairline mark that stands out against the lighter background"
        source: "付録-3 p.22 最大ひびわれ幅「小」（PDF p.292）"
      - text: "a narrow sharp-edged opening that splits the surface into two parts"
        source: "付録-3 p.22 最大ひびわれ幅「大」（PDF p.292）"
      - text: "a slightly open line with crumbled edges"
        source: "参考資料2 ひびわれ 写真（PDF p.384-386）"
      - text: "a web of thin lines forming irregular polygons like a turtle shell"
        source: "付録-3 p.26 パターン⑨亀甲状・くもの巣状（PDF p.296）"
      - text: "several parallel vertical lines at regular intervals"
        source: "付録-3 p.26 パターン⑩規則的な間隔で鉛直方向（PDF p.296）"
      - text: "thin lines running diagonally at about 45 degrees"
