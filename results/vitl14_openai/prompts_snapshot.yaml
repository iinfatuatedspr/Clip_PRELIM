# ===========================================================================
# prompts.yaml —— 定稿版（2026-09-28）
# 依据：橋梁定期点検要領（令和6年7月）。每条 attr 的 source 都对应实际阅读过的页面。
#
# 规则（务必遵守，否则实验结论不成立）：
#   1. 在 test 集上跑出结果之后，不得再根据结果修改本文件并重跑。
#      如确有 bug 需要修改，必须在 meta.change_log 里记录修改内容和原因。
#   2. 修改任何一条描述之前，先想清楚能否在面试中解释它的出处。
# ===========================================================================

meta:
  author: "（申请者姓名）"
  inspection_manual: "橋梁定期点検要領（令和6年7月, 国土交通省道路局国道・技術課, 版次20250314）"
  term_translation_system: "按字面逐字直译，不替换为英语领域惯用术语（ひびわれ=cracking, 剥離=peeling, 鉄筋露出=iron bar exposure, 遊離石灰=free lime, 錆汁=rust juice）；由 Claude 按此规则生成, 2026-09-28"
  llm_for_paraphrase: "Claude Opus 5.5, 2026-09-28；严格按 llm_paraphrase_prompt.md 的要求生成（12条: 短4/中4/长4, 遵守禁用词），未挑选、未润色"
  change_log: []

# ---- 包装模板 --------------------------------------------------------------
templates:
  - "a photo of {} on a concrete surface."
  - "a close-up photo of {} on concrete."
  - "an inspection photo of {} on a concrete bridge."
  - "a photo of {} on a concrete wall."
  - "a cropped photo of {} on a concrete structure."
  - "a bright photo of {} on concrete."
  - "a dark photo of {} on concrete."
  - "a blurry photo of {} on concrete."
  - "a photo showing {} on the underside of a concrete bridge."
  - "a detailed photo of {} on a concrete surface."

desc_template: "a photo of a concrete surface with {}."
label_desc_template: "a photo of {label} on a concrete surface, which has {desc}."

# ---- 正常状态（所有条件共用；不用否定词） --------------------------------------
normal:
  basic:
    - "a photo of a clean concrete surface."
    - "a photo of an intact concrete wall."
    - "a photo of smooth concrete."
    - "a close-up photo of sound concrete."
    - "a photo of plain grey concrete."
    - "a photo of concrete in good condition."
    - "a photo of a uniform concrete texture."
    - "a photo of a well-maintained concrete structure."
    - "a photo of a normal concrete bridge surface."
    - "a photo of a solid concrete slab."
  # hard negatives：看起来像损伤、但不属于 CODEBRIM 五类损伤的东西。
  # 注意与要領的分类并不完全一致：要領把"特異な変色"算作⑲変色・劣化，
  # 把表面流水造成的析出物算作⑰その他（不是遊離石灰）。
  extended:
    dirt_stain:
      - "a photo of a concrete surface with dark dirt stains."
      - "a photo of a concrete surface with dust and grime."
      - "a photo of a concrete surface with patchy dirt marks."
    formwork_joint:
      - "a photo of a concrete surface with straight formwork joint lines."
      - "a photo of a concrete surface with round form tie holes."
      - "a photo of a concrete surface with a construction joint."
    shadow:
      - "a photo of a concrete surface with a dark shadow."
      - "a photo of a concrete surface with shadows of a railing."
      - "a photo of a concrete surface in partial shade."
    surface_pores:
      - "a photo of a concrete surface with small air bubble holes."
      - "a photo of a concrete surface with a rough porous texture."
      - "a photo of a concrete surface with tiny surface voids."
    paint_marking:
      - "a photo of a concrete surface with painted inspection markings."
      - "a photo of a concrete surface with graffiti."
      - "a photo of a concrete surface with chalk lines."

# ---- 五种损伤 --------------------------------------------------------------
# 页码写法：「付録-3 p.xx」为要領内页码；括号内 PDF p. 为 yobo7_16.pdf 的页码。
